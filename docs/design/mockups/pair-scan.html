<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=412">
<title>Scan the pairing code</title><link rel="stylesheet" href="base.css">
<style>
  .phone { background: #000; color: #fff; }
  .cam { position: absolute; inset: 0; background: url(assets/photos/boathouse.jpg) center/cover; filter: brightness(.55) saturate(.8); }
  .top { position: absolute; top: 0; left: 0; right: 0; padding: 32px 4px 0; background: var(--media-scrim); display: flex; align-items: center; gap: 4px; height: 96px; z-index: 2; }
  .top .iconbtn { color: #fff; }
  .guide { position: absolute; left: 86px; top: 300px; width: 240px; height: 240px; z-index: 2; }
  .guide i { position: absolute; width: 44px; height: 44px; border: 4px solid #fff; }
  .guide i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 20px; }
  .guide i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 20px; }
  .guide i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 20px; }
  .guide i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 20px; }
  .hint { position: absolute; left: 20px; right: 20px; top: 572px; z-index: 2; text-align: left; }
  .hint .box { background: var(--media-scrim); border-radius: 16px; padding: 14px 16px; }
  .alt { position: absolute; left: 20px; right: 20px; bottom: 40px; z-index: 2; }
  .alt .btn { width: 100%; background: rgba(255,255,255,.14); color: #fff; height: 56px; }
</style></head>
<body>
<div class="phone" data-status="none" data-gesture="none">
  <div class="cam"></div>
  <div class="top"><span class="iconbtn" data-icon="arrow-left"></span><span class="t-title">Scan the pairing code</span></div>
  <div class="guide"><i></i><i></i><i></i><i></i></div>
  <div class="hint"><div class="box t-body">Run savesama on your PC or in Termux. The code appears in the terminal.</div></div>
  <div class="alt"><span class="btn" data-icon="keyboard" data-icon-class="s20">Enter details instead</span></div>
</div>
<script src="shared.js"></script>
</body></html>
