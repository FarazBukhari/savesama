<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=412">
<title>Welcome</title><link rel="stylesheet" href="base.css">
<style>
  .deck { height: 360px; display: flex; flex-direction: column; justify-content: space-between; padding: 56px 20px 24px; }
  .logos { display: flex; gap: 20px; }
  .ob { padding: 20px 20px 0; flex: 1; display: flex; flex-direction: column; }
  .acts { padding: 0 20px 16px; display: flex; flex-direction: column; gap: 4px; align-items: center; }
  .tape { margin-top: 0; }
  .tape > i { flex: 1 !important; }
  .tape-legend > span { flex: 1 !important; }
</style></head>
<body>
<div class="phone" data-status="deck">
  <section class="deck">
    <span class="t-display" style="font-size:34px;line-height:40px">SaveSama</span>
    <h1 class="t-headline" style="font-size:30px;line-height:36px;max-width:330px">Save posts to your phone, without an account</h1>
  </section>
  <div class="ob">
    <div class="tape"><i><b style="width:100%"></b></i><i></i><i></i></div>
    <div class="tape-legend"><span class="now">Welcome</span><span>Server</span><span>Gallery</span></div>
    <p class="t-body ink2" style="margin-top:28px">Video, photos and audio at the best quality each app offers. No ads, no cloud, nothing to sign in to.</p>
    <div class="logos" style="margin-top:24px;display:grid;grid-template-columns:1fr 1fr;gap:14px 12px">
      <span class="stat t-body-m" data-icon="youtube-logo">&nbsp;YouTube</span><span class="stat t-body-m" data-icon="instagram-logo">&nbsp;Instagram</span><span class="stat t-body-m" data-icon="tiktok-logo">&nbsp;TikTok</span><span class="stat t-body-m" data-icon="facebook-logo">&nbsp;Facebook</span><span class="stat t-body-m" data-icon="threads-logo">&nbsp;Threads</span>
    </div>
  </div>
  <div class="acts"><span class="btn primary big">Get started</span></div>
</div>
<script src="shared.js"></script>
</body></html>
