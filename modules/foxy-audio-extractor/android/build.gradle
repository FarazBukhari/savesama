plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.foxyaudioextractor'
version = '0.1.0'

android {
  namespace "expo.modules.foxyaudioextractor"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // Media3 Transformer powers `transcodeVideo`'s downscale. Hand-rolling
  // decode → GL scale → encode → MediaMuxer is where rotation metadata and
  // timestamp handling go wrong (portrait video coming out sideways is the
  // classic failure); Transformer handles both. All media3 artifacts must share
  // one version.
  implementation "androidx.media3:media3-transformer:1.10.1"
  implementation "androidx.media3:media3-effect:1.10.1"
  implementation "androidx.media3:media3-common:1.10.1"
}
