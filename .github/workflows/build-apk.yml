name: Build APK

on:
  # Automatic builds only for main (direct pushes and merged PRs). Other branches
  # build on demand via the Actions tab / `gh workflow run`.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        default: preview
        options:
          - development
          - preview
          - production

jobs:
  build:
    runs-on: ubuntu-latest
    # A push event carries no inputs, so the workflow_dispatch `default` does not
    # apply — fall back to it explicitly or eas gets an empty --profile.
    env:
      PROFILE: ${{ inputs.profile || 'preview' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Compute APK name
        run: echo "APK_BASENAME=foxy-downloader-${PROFILE}-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build APK
        run: eas build --platform android --profile "$PROFILE" --local --non-interactive --output "${{ github.workspace }}/${APK_BASENAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_BASENAME }}
          path: ${{ github.workspace }}/${{ env.APK_BASENAME }}.apk
