name: Build APK

on:
  # Manual only. Release builds moved to EAS cloud (`eas build -p android --profile
  # preview`), which is the natural pairing with EAS Update and doesn't run into the
  # runner's disk ceiling: runs 31361056023 and 31362358521 both exhausted the disk
  # during packaging, the first in :app:packageRelease and the second zipping
  # reanimated's AAR. The native dependency graph was unchanged from the last green
  # run (identical OTA fingerprint 168fc088…), so the cause was the runner
  # environment, not this repo.
  #
  # Kept dispatchable because building on a runner is still useful for bisecting a
  # native break without spending EAS build credits. If it fails on disk again, free
  # space first: /usr/share/dotnet, /opt/ghc, CodeQL and the prebuilt Docker images
  # are ~30 GB between them.
  #
  # On `reactNativeArchitectures`: it controls which ABIs get PACKAGED, not which get
  # COMPILED. The Aug 6 runner APK carried arm64-v8a alone (38 MB) while its log shows
  # CMake building all four, so the env var worked for packaging and did nothing for
  # the compile that actually exhausted the disk. An earlier version of this comment
  # claimed the setting never worked at all — it did, just not for disk.
  #
  # Cloud builds get the same packaging filter from the preview profile's `env` in
  # eas.json; without it EAS ships all four ABIs (93 MB, half of it emulator-only).
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        default: preview
        options:
          - development
          - preview
          - production

jobs:
  build:
    runs-on: ubuntu-latest
    # A push event carries no inputs, so the workflow_dispatch `default` does not
    # apply — fall back to it explicitly or eas gets an empty --profile.
    env:
      PROFILE: ${{ inputs.profile || 'preview' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Saves the dependency cache and the Gradle daemon's own artifacts. This
      # does NOT cache the CMake output — the native compile happens in a fresh
      # temp dir each run — so expect a modest win here, not a dramatic one.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json', 'eas.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Compute APK name
        run: echo "APK_BASENAME=savesama-${PROFILE}-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # ABI selection lives in eas.json's preview profile, not here. This step used
      # to export ORG_GRADLE_PROJECT_reactNativeArchitectures, which does not work:
      # `eas build --local` runs `expo prebuild`, which writes reactNativeArchitectures
      # into the generated android/gradle.properties, and that file wins over the env
      # var. Run 31361056023 had the env var set to arm64-v8a and still compiled all
      # four ABIs, then died with "No space left on device" in :app:packageRelease.
      #
      # The fix is a command-line -P (highest-precedence project property) via the
      # profile's android.gradleCommand. Verify it took by grepping a build log for
      # `[x86]` tasks — there should be none.
      - name: Build APK
        run: eas build --platform android --profile "$PROFILE" --local --non-interactive --output "${{ github.workspace }}/${APK_BASENAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_BASENAME }}
          path: ${{ github.workspace }}/${{ env.APK_BASENAME }}.apk
